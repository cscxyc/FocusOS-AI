server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:focusos_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${MYSQL_USER:focusos}
    password: ${MYSQL_PASSWORD:focusos_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  sql:
    init:
      mode: never

focusos:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${LLM_PROVIDER}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${LLM_MODEL:qwen-plus}
    embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v2}
  milvus:
    host: ${MILVUS_HOST}
    port: ${MILVUS_PORT:19530}
    collection-name: focusos_documents

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.focusos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
  file:
    name: ./logs/focusos-ai.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB