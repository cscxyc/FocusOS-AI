# Sprint 8-E Task 11: Prometheus 配置
# 抓取 FocusOS AI Backend 的 /actuator/prometheus 端点

global:
  scrape_interval: 15s       # 默认抓取间隔
  evaluation_interval: 15s   # 规则评估间隔
  external_labels:
    monitor: 'focusos-monitor'

scrape_configs:
  # 抓取 FocusOS AI Backend 的 Prometheus 指标
  - job_name: 'focusos-backend'
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['focusos-backend:8080']
        labels:
          application: 'focusos-ai'
          service: 'backend'

  # 抓取 Prometheus 自身指标（用于监控 Prometheus 健康状况）
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 抓取 MySQL exporter（可选，未启用）
  # - job_name: 'mysql'
  #   static_configs:
  #     - targets: ['mysql-exporter:9104']

  # 抓取 Redis exporter（可选，未启用）
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
