# Sprint 8-E Task 12: CI/CD Pipeline
# 触发条件：push 到 main / develop 分支，或 Pull Request
# 流程：Maven Test → Docker Build → Docker Tag → (可选) Deploy

name: FocusOS AI CI/CD

on:
  push:
    branches: [ main, develop, 'sprint/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'

jobs:
  # ============================================================
  # Stage 1: Maven 编译与单元测试
  # ============================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven (Skip Tests for Speed)
        working-directory: ./backend
        run: mvn -B clean package -DskipTests

      - name: Run Unit Tests
        working-directory: ./backend
        run: mvn -B test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusos-backend-jar
          path: backend/target/focusos-ai-*.jar
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ============================================================
  # Stage 2: Docker Build (仅构建验证，不推送镜像)
  # 如需推送到 Docker Hub，请在 Settings → Secrets 配置 DOCKER_USERNAME / DOCKER_TOKEN
  # 并将下方 push 改为 true，将镜像名改为 ${{ secrets.DOCKER_USERNAME }}/focusos-ai
  # ============================================================
  docker-build:
    name: Docker Build (Verity Only)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata
        id: meta
        run: |
          echo "VERSION=${GITHUB_REF##*/}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build Docker Image (Local Only, No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            focusos-ai:latest
            focusos-ai:${{ steps.meta.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=FocusOS AI
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.TIMESTAMP }}

  # ============================================================
  # Stage 3: Docker Compose Integration Check
  # 验证 docker-compose.yml 语法正确性（可选，仅 main 分支）
  # ============================================================
  compose-check:
    name: Docker Compose Check
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          echo "Validating docker-compose.yml..."
          # Python 3.9+ has tomllib, use pip install pyyaml for YAML parsing
          pip install pyyaml
          python3 -c "
          import yaml, sys
          try:
              with open('docker-compose.yml', 'r') as f:
                  data = yaml.safe_load(f)
              assert 'services' in data, 'Missing services key'
              print('docker-compose.yml: VALID')
              print(f'Services: {list(data[\"services\"].keys())}')
          except Exception as e:
              print(f'INVALID: {e}')
              sys.exit(1)
          "
